name: Verify plugin

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  php:
    name: PHP ${{ matrix.php }} and package
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php: ['8.2', '8.4']
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # 2.40.0
        with:
          php-version: ${{ matrix.php }}
          extensions: curl, zip
          tools: composer:2.10.3
          coverage: none
      - run: composer validate --strict
      - run: composer install --no-dev --prefer-dist --no-interaction --optimize-autoloader
      - name: PHP syntax
        run: git ls-files -z '*.php' | xargs -0 -n1 php -l
      - run: composer test
      - run: php bin/build-release.php --skip-composer
      - run: php tests/package.php
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: clerk-wp-sync-php-${{ matrix.php }}
          path: release/*.zip
          retention-days: 7

  frontend:
    name: Frontend bridge
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
      - run: node --check assets/js/clerk-auth.js
      - run: node tests/frontend.cjs
